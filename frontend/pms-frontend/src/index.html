<!doctype html>
<!-- Shell page of the SPA: Angular renders into <app-root> below. The build tool injects the
     compiled bundle at the end of <body>, which calls bootstrapApplication() from main.ts. -->
<html lang="en">
<head>
  <!-- UTF-8 so accented French letters render correctly instead of being mis-guessed as Latin-1. -->
  <meta charset="utf-8">
  <title>PMS · ST2I</title>
  <!-- Base URL for the Angular router: without "/", a refresh on a nested route would try to
       load the JS bundle relative to that route and get a blank page. -->
  <base href="/">
  <!-- Real device width, needed for the responsive rules in styles.scss (sidebar under 768px). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/aida-public/AB6AXuCw_yrHN-OmVPPni9xX2nNod_E6MTlwO1lflvFjx-0UznQ8bwUkA4RwBfzUcTVnbQ-5HH23gMON8novBTrdrNinlybsrRx6sUzhLrjTuN8UrDZFRnTOuB-TI3jfnxp7WcHqMwIRDv21_t0z5w__oYTKLe6WGemmNGbYMy7G0tBNC-hc4vnfeq_EM_3VW4O3rdQ8IxGtfB9nsEsgFShhYidPbQ52BLx6wfZLiluM4NwiUdsguWnzG3v7f8gq4nQOMZeqk2w1Rnazt3k">
  <!-- preconnect to both Google Fonts hosts early (CSS host + font-file host); crossorigin on
       the second is required because font fetches always use anonymous CORS mode. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- display=swap shows the fallback font immediately instead of hiding text while Inter loads. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
