# Configuration nginx du frontend PMS (ADR-026).
#
# nginx sert le build Angular ET relaie /api vers le backend : l'application et
# l'API partagent donc la même origine. Le cookie de rafraîchissement
# (Path=/api/auth/refresh ; SameSite=Strict) fonctionne sans aucun CORS.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compression des réponses textuelles
    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Ne pas divulguer la version de nginx
    server_tokens off;

    # ── Cible du healthcheck du conteneur ────────────────────────
    # Volontairement hors de la logique SPA : doit répondre même si le build
    # Angular est absent ou cassé.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Reverse proxy vers le backend ────────────────────────────
    # `^~` : ce préfixe l'emporte sur la location regex des fichiers statiques.
    # Pas d'URI après le host dans proxy_pass ⇒ le chemin /api/... est transmis tel quel.
    location ^~ /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Documentation OpenAPI (pratique pour la démonstration) ───
    location ^~ /v3/api-docs {
        proxy_pass       http://backend:8080;
        proxy_set_header Host $host;
    }
    location ^~ /swagger-ui {
        proxy_pass       http://backend:8080;
        proxy_set_header Host $host;
    }

    # ── Catalogues de traduction ─────────────────────────────────
    # Transloco charge /i18n/<scope>/<langue>.json. Ces fichiers sont copiés tels
    # quels par le build : ils N'ONT PAS d'empreinte dans leur nom. Les mettre en
    # cache longue durée figerait les traductions après un redéploiement.
    location ^~ /i18n/ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── Fichiers de build empreintés ─────────────────────────────
    # outputHashing: all ⇒ le nom change à chaque modification : cache immuable.
    # try_files ... =404 (et non /index.html) : renvoyer du HTML pour un .js
    # manquant produirait « Unexpected token '<' » côté navigateur.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ne doit jamais être mis en cache : il référence les noms empreintés.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Routage côté client Angular ──────────────────────────────
    # Une URL profonde rechargée (ex. /projects/1) doit servir index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
