# ── Profil Production ─────────────────────────────────────────────
# Variables d'environnement OBLIGATOIRES en production :
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
#   JWT_SECRET  (clé HS512 en base64, 64 octets minimum)

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    locations: classpath:db/migration   # Pas de seeds en prod

pms:
  jwt:
    secret: ${JWT_SECRET}               # Jamais en clair dans le code
    access-token-expiration: 900        # 15 minutes
    refresh-token-expiration: 604800    # 7 jours
  security:
    bcrypt-strength: 12

server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    com.pms: INFO
