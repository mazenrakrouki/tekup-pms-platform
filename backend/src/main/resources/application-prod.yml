# Production profile, used by the containers (ADR-026): nothing hard-coded, sensitive values come
# from env vars, logs go quiet, Flyway checksum validation is back on. Loaded on top of
# application.yml when docker-compose sets SPRING_PROFILES_ACTIVE=prod; only the keys below change.
#
# Required env vars: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD, JWT_SECRET (raw UTF-8
# bytes, at least 64 chars — shorter is silently downgraded to HMAC-SHA256 below 64, and only
# rejected under 32; check the length when setting it, not after an incident).
# Optional: PORT, COOKIE_SECURE, CORS_ALLOWED_ORIGINS, LOG_ROOT_LEVEL, PMS_DEMO_SEED_USERS (maps to
# pms.demo.seed-users via relaxed binding; DataInitializer treats it missing as "seed demo accounts").

spring:
  datasource:
    # No fallback anywhere in this URL (unlike application.yml): a missing DB_HOST must fail
    # startup loudly, not silently try localhost and fail every request afterward.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 20 instead of 10: this instance serves every user at once, not one developer laptop.
      maximum-pool-size: 20

  jpa:
    # Repeated explicitly so dev's SQL logging can never leak into a production log.
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    # NOTE: includes V26__seed_demo_data.sql, so demo accounts are seeded under this profile too.
    # Two independent sources of demo data, only one has an off switch: DataInitializer (Java
    # accounts) is disabled by PMS_DEMO_SEED_USERS=false; V26 and DemoDataSeeder are not — a real
    # deployment must delete those rows itself.
    locations: classpath:db/migration
    # On (unlike the dev profile): a fresh container volume means any checksum drift can only mean
    # an already-applied migration was edited afterward, so failing loudly is the only safe answer.
    validate-on-migrate: true

pms:
  jwt:
    secret: ${JWT_SECRET}               # Never in clear in the code
    # Back to the short lifetimes of application.yml (dev relaxes these); repeated here so the
    # real production numbers are readable in one place.
    access-token-expiration: 900        # 15 minutes
    refresh-token-expiration: 604800    # 7 days
    remember-me-expiration:  2592000    # 30 days
  security:
    # Never lower this for "performance" — these are the hashes an attacker would target if the DB leaked.
    bcrypt-strength: 12
    # False by default since the demo stack runs on plain HTTP; set true once the stack is behind HTTPS.
    cookie-secure: ${COOKIE_SECURE:false}   # true as soon as the stack is behind HTTPS
  cors:
    # Single origin is enough here: nginx serves the app and proxies /api on the same origin, so
    # the browser never sees a second one (unlike dev's separate port 4200).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}

server:
  # 8080 in-container, not 8090. Must agree with the healthcheck and the nginx proxy config.
  port: ${PORT:8080}

logging:
  level:
    # WARN by default; LOG_ROOT_LEVEL can raise it temporarily without rebuilding the image.
    # docker-compose.yml actually sets this to INFO for the demo stack, so INFO lines are expected.
    root: ${LOG_ROOT_LEVEL:WARN}
    # App packages stay traceable at INFO even when the rest is at WARN.
    com.pms: INFO
    # Without this, the first-start migration run (60-90s) prints nothing and looks frozen.
    org.flywaydb: INFO
