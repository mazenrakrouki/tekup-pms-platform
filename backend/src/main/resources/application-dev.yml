# =============================================================================
# application-dev.yml -- DEVELOPMENT profile of the PMS backend.
#
# WHAT THIS FILE IS
#   The handful of settings that differ when the application runs on a
#   developer's own machine: a local database, loud logs, and longer tokens so
#   testing a screen is not interrupted every 15 minutes.
#
# WHERE IT SITS IN THE FLOW
#   Spring Boot reads application.yml first, then this file ON TOP of it. Only
#   the keys written below are replaced; everything else (Hikari pool, Flyway
#   setup, Caffeine cache, Actuator, CORS on port 4200, bcrypt strength 12,
#   server port 8090) still comes from application.yml.
#   Activated with:  --spring.profiles.active=dev
#   Or in the IDE:   VM options = -Dspring.profiles.active=dev
#
# WHY IT EXISTS -- what would break if you deleted it
#   Two things would stop working. First, application.yml gives no default for
#   DB_PASSWORD and JWT_SECRET on purpose, so without this file the app would
#   refuse to start on a laptop unless both environment variables were set by
#   hand every time. Second, nothing would be visible: no SQL in the console,
#   no Spring Security trace, so debugging an authorization problem would mean
#   guessing.
#
# RELATED FILES
#   application.yml       -- the base every profile builds on
#   application-prod.yml  -- the container profile (ADR-026); read the two side
#                            by side to see what is deliberately different
# =============================================================================

spring:
  datasource:
    # A database dedicated to development: "pms_dev", separate from the
    # "pms_db" default of application.yml. Why a separate database: Flyway
    # replays migrations here constantly and the data is thrown away, so it
    # must never be the same database as a demo or a shared instance.
    url: jdbc:postgresql://localhost:5432/pms_dev
    username: pms_dev
    # Written in clear ON PURPOSE, and only in this file. This value is a local
    # convenience, it never leaves the developer's machine, and the "dev"
    # profile is never activated on a server. It also overrides the
    # "${DB_PASSWORD}" of application.yml, which has no default: because this
    # key wins, the placeholder in the base file is never resolved and the
    # startup does not fail.
    password: pms_dev

  jpa:
    # Print every SQL statement Hibernate sends. Why in dev only: this is how
    # you catch an N+1 problem (one SELECT per row of a list) or a query that
    # fetches a whole table. In production it would flood the logs and could
    # write business data into them.
    show-sql: true
    properties:
      hibernate:
        # Pretty-print those statements over several lines with indentation.
        # A twelve-join query is unreadable on a single line.
        format_sql: true

  flyway:
    # Same folder as the base file. It is repeated here so that a developer
    # reading only this profile sees where the migrations come from; it does
    # not change anything.
    locations: classpath:db/migration
    # Repeated for the same reason: a migration numbered below one already
    # applied is refused, exactly as in production. Keeping the rule identical
    # in dev is the point -- the failure must happen on the laptop, not on the
    # server.
    out-of-order: false

  output:
    ansi:
      # Force colour codes in the console. Spring normally disables them when
      # it does not detect a real terminal, which is what happens inside an
      # IDE console. Without this, an ERROR line looks exactly like an INFO
      # line in a wall of DEBUG output.
      enabled: always   # Colours in the console

pms:
  jwt:
    # DEVELOPMENT secret only -- never used outside the dev profile.
    # The base profile no longer has a default value (fail fast when it is not
    # configured), so this profile provides its own explicitly.
    # Raw UTF-8 bytes (no base64 decoding) -> at least 64 characters, which is
    # what makes jjwt pick HMAC-SHA512 rather than silently falling back to
    # HMAC-SHA256. The string below is 80 characters, so it is comfortably
    # above that line. See the longer note on pms.jwt.secret in application.yml.
    # It is safe to keep it in the repository precisely because it is useless
    # anywhere else: prod reads ${JWT_SECRET} from the environment, so a token
    # signed with this string is rejected by any real deployment.
    secret: dev-only-secret-not-for-production-dev-only-secret-not-for-production-0123456789
    # 1 hour instead of the 15 minutes of application.yml. Why: while building
    # a screen you reload the browser dozens of times, and a token expiring
    # mid-session sends you back to the login page in the middle of a test.
    # The short lifetime matters in production, where a leaked token is a real
    # risk; on a laptop it only slows the work down.
    access-token-expiration: 3600   # 1 hour in dev (easier for testing)
    # 1 day instead of 7. Long enough to keep a session over a working day,
    # short enough that the refresh path is still exercised regularly -- a
    # refresh that never runs in dev is a refresh that is never tested.
    refresh-token-expiration: 86400 # 1 day in dev
    # 30 days, deliberately the SAME value as production. Why not shortened
    # like the other two: this one is shown to the user ("Remember me for 30
    # days"), so testing it with a different number would test something the
    # user never sees.
    remember-me-expiration:  2592000 # 30 days (same as prod, to test the real behaviour)

logging:
  level:
    # Third-party libraries stay at INFO, otherwise the useful lines below
    # would drown in framework noise.
    root: INFO
    # The project's own packages at DEBUG: this is where the business logs of
    # the services are.
    com.pms: DEBUG
    # Spring Security at DEBUG. This is the single most useful line of the
    # file: it prints which filter ran, which Authentication was built, and
    # why a request was refused. Without it, a 403 coming from
    # @PreAuthorize("hasAuthority('X')") is a silent, unexplained failure and
    # you cannot tell a missing permission (RBAC) from a failed project-scope
    # check (ProjectScopeInterceptor, ADR-021).
    org.springframework.security: DEBUG
    # Flyway at DEBUG: prints every migration as it is applied, with its
    # version and its checksum. Needed when a new V*.sql does not behave, or
    # to see exactly where a failed migration stopped.
    org.flywaydb: DEBUG
    # The SQL statements themselves (the companion of show-sql above, but
    # routed through the logging system rather than standard output).
    org.hibernate.SQL: DEBUG
    # TRACE on this logger prints the VALUES bound to the "?" placeholders of
    # each statement. Why it is needed: org.hibernate.SQL alone shows
    # "where project_id=?" and you cannot tell which project was queried.
    # Never raise this in production -- the bound values include e-mail
    # addresses, amounts, and everything else that travels in a query.
    org.hibernate.orm.jdbc.bind: TRACE
