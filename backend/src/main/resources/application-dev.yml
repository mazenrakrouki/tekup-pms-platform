# Development profile: local database, loud logs, longer tokens so testing isn't interrupted every
# 15 minutes. Loaded on top of application.yml with --spring.profiles.active=dev; only the keys
# below are overridden. Also supplies DB_PASSWORD/JWT_SECRET, which the base file leaves without a default.

spring:
  datasource:
    # Dedicated "pms_dev" database, separate from pms_db, since Flyway replays migrations here constantly.
    url: jdbc:postgresql://localhost:5432/pms_dev
    username: pms_dev
    # Plain-text on purpose: local-only convenience, never used outside this profile. Overrides the
    # no-default ${DB_PASSWORD} in application.yml so a laptop doesn't need the env var set.
    password: pms_dev

  jpa:
    # Prints every SQL statement, the way to catch an N+1 or a full-table fetch during dev.
    show-sql: true
    properties:
      hibernate:
        # Pretty-prints multi-join statements over several lines.
        format_sql: true

  flyway:
    # Repeated from the base file for readability; doesn't change behavior.
    locations: classpath:db/migration
    # Same rule as prod, kept identical so an ordering failure surfaces on the laptop, not the server.
    out-of-order: false

  output:
    ansi:
      # Forces colour codes, since Spring disables them by default inside an IDE console.
      enabled: always   # Colours in the console

pms:
  jwt:
    # Dev-only secret; safe to commit since prod reads ${JWT_SECRET} from the environment and would
    # reject a token signed with this one. 80 chars, comfortably above the 64 needed for HMAC-SHA512.
    secret: dev-only-secret-not-for-production-dev-only-secret-not-for-production-0123456789
    # 1 hour instead of 15 minutes, so reloading the browser during dev doesn't bounce you to login.
    access-token-expiration: 3600   # 1 hour in dev (easier for testing)
    # 1 day: long enough for a working session, short enough that the refresh path still gets exercised.
    refresh-token-expiration: 86400 # 1 day in dev
    # Same as prod on purpose — this value is shown on the login page, so it must test the real behavior.
    remember-me-expiration:  2592000 # 30 days (same as prod, to test the real behaviour)

logging:
  level:
    root: INFO
    # App packages at DEBUG for the business logs.
    com.pms: DEBUG
    # Prints which filter ran and why a request was refused — the fastest way to tell a missing
    # permission (RBAC) apart from a failed project-scope check (ADR-021).
    org.springframework.security: DEBUG
    # Prints each migration as it's applied, useful when a new V*.sql misbehaves.
    org.flywaydb: DEBUG
    # SQL statements themselves (companion of show-sql, routed through logging).
    org.hibernate.SQL: DEBUG
    # Prints the actual values bound to "?" placeholders. Never raise this in prod — it logs emails and amounts.
    org.hibernate.orm.jdbc.bind: TRACE
