# Base Spring Boot config shared by every environment. dev/prod/test profiles load on top of this
# and override individual keys; whatever a profile doesn't mention keeps the value written here.
# ${NAME:value} falls back to "value" if the env var is unset; ${NAME} with no colon fails startup
# on purpose if missing (e.g. DB_PASSWORD) so a misconfigured deploy never boots with a known default.
spring:
  application:
    # Logical service name, shown in startup logs and monitoring.
    name: pms-backend

  # -- Database --------------------------------------------------------------
  datasource:
    # Each part has its own env var with a local default, so dev needs zero config.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pms_db}
    username: ${DB_USERNAME:pms_user}
    # No default on purpose: startup must fail rather than boot with a well-known password.
    password: ${DB_PASSWORD}
    # Named explicitly since the test classpath also carries the H2 driver.
    driver-class-name: org.postgresql.Driver
    # HikariCP connection pool: reuses a small set of open connections instead of opening one per request.
    hikari:
      # Ceiling of 10 connections so a request burst can't exhaust PostgreSQL's shared connection limit.
      maximum-pool-size: 10
      # Keep only 2 alive when idle, rather than holding the pool at full size for nothing.
      minimum-idle: 2
      # Fail fast after 20s waiting for a free connection instead of leaving requests hanging.
      connection-timeout: 20000

  # -- JPA / Hibernate -------------------------------------------------------
  jpa:
    hibernate:
      # Validate entities against real tables at startup; never auto-creates/alters — Flyway owns the schema (ADR-019).
      ddl-auto: validate
    # No SQL logging here; would flood prod logs and can carry business data. Dev profile turns it on.
    show-sql: false
    # Open Session In View off: frees the DB connection once the service returns, and turns a
    # lazy-load outside the transaction into a loud LazyInitializationException instead of silent N+1 queries.
    open-in-view: false
    properties:
      hibernate:
        # No pretty-printing (only relevant when show-sql is true).
        format_sql: false
        # Fixed schema, independent of the connecting role's search_path.
        default_schema: public
        jdbc:
          # Batches up to 25 INSERT/UPDATE statements per round trip.
          batch_size: 25
        # Groups pending inserts/updates by table first, so the batch above isn't broken up by interleaved tables.
        order_inserts: true
        order_updates: true

  # -- Flyway (ADR-019) ------------------------------------------------------
  # Runs V1..V28 at startup and records progress in flyway_schema_history, so an empty database
  # plus this code always reproduces the same schema.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Refuses to adopt a database with tables but no flyway_schema_history, rather than silently
    # marking migrations as applied without having run them.
    baseline-on-migrate: false
    # Rejects a migration numbered lower than one already applied, so scripts always run in the same order.
    out-of-order: false
    # Off here since the local dev database has diverged across iterations; prod turns this back on.
    validate-on-migrate: false

  # -- Cache (security context -- ADR-017) -----------------------------------
  # Caffeine in-memory cache, keyed "<email>:<tokenVersion>", holding the ready-built Authentication
  # (permission codes) for a session. Lets a DB-driven permission change apply on the next request
  # without a lookup on every call; token_version bump on change invalidates the key immediately.
  cache:
    type: caffeine
    caffeine:
      # Ceiling of 2000 entries (LRU eviction) so a long-running server's heap doesn't grow unbounded.
      # 5-minute TTL is a safety net, not the revocation path — that's the token_version key change.
      spec: maximumSize=2000,expireAfterWrite=5m

  # -- JSON ------------------------------------------------------------------
  jackson:
    serialization:
      # ISO-8601 text dates instead of epoch millis, for readability on the Angular/Swagger side.
      write-dates-as-timestamps: false
    # Fixed UTC so the same deadline doesn't shift across server/browser time zones.
    time-zone: UTC

  # -- MVC -------------------------------------------------------------------
  mvc:
    # Raise NoHandlerFoundException on an unmatched URL so GlobalExceptionHandler can return the
    # same JSON error shape as every other error.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # Must be off for the setting above: the default static-file handler would otherwise catch
      # every URL itself. Costs nothing since nginx serves the Angular build (ADR-026).
      add-mappings: false

# -- Server --------------------------------------------------------------------
server:
  # Local "mvn spring-boot:run" port, kept clear of 8080 (used by Apache on the dev machine). Prod overrides with ${PORT:8080}.
  port: 8090
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      # Forces UTF-8 on both request and response regardless of client charset, since French names/comments carry accents.
      force: true

# -- PMS configuration ---------------------------------------------------------
# Everything under "pms" is this project's own config, read with @Value in JwtService, SecurityConfig and AuthController.
pms:
  jwt:
    # No default (same reasoning as DB_PASSWORD). Used as raw UTF-8 bytes, not base64-decoded: key
    # length picks the HMAC variant (>=64B SHA512, >=48B SHA384, >=32B SHA256, <32B throws). A
    # secret just above 32 bytes is silently downgraded to SHA256 with no warning — aim for 64+.
    secret: ${JWT_SECRET}
    # Access token lifetime: short because it travels on every call and sits in browser memory;
    # the frontend silently refreshes so the user never notices.
    access-token-expiration: 900        # 15 minutes (in seconds)
    # Refresh token lives in an HttpOnly cookie and rotates on every use, so a stolen one is usable once.
    refresh-token-expiration: 604800    # 7 days (in seconds)
    # "Remember me" lifetime; must match the login page's "Remember me for 30 days" label.
    remember-me-expiration:  2592000    # 30 days -- must match the label shown
  security:
    # BCrypt cost factor (2^12 rounds, ~0.25s): slow enough to resist offline guessing, not so slow login lags.
    bcrypt-strength: 12
    # Secure flag on the refresh-token cookie; false by default since local/demo runs on plain HTTP.
    cookie-secure: ${COOKIE_SECURE:false}   # true behind HTTPS only
  cors:
    # Angular dev server (4200) and this backend (8090) are different origins, so the browser
    # blocks calls unless 4200 is listed here.
    allowed-origins:
      - "http://localhost:4200"
      - "http://127.0.0.1:4200"

# -- API documentation (springdoc) ---------------------------------------------
# Generates the OpenAPI description and Swagger UI; SecurityConfig leaves these URLs open (permitAll).
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Alphabetical order, since the natural (discovery) order isn't stable across builds.
    tags-sorter: alpha
    operations-sorter: alpha
    # Skips Swagger UI's built-in Petstore demo definition.
    disable-swagger-default-url: true

# -- Actuator (container probes -- ADR-026) ------------------------------------
# Only health/info are exposed; docker-compose's healthcheck polls /actuator/health and the
# frontend container waits on it via depends_on: service_healthy.
management:
  endpoints:
    web:
      exposure:
        # Whitelist — everything else (env, beans, mappings, heapdump...) stays unreachable.
        include: health,info
  endpoint:
    health:
      # Reduced to {"status":"UP"}, no component breakdown, since this endpoint is intentionally public.
      show-details: never
      probes:
        # Adds liveness/readiness probes so an orchestrator doesn't send traffic during the 60-90s Flyway run.
        enabled: true
  info:
    env:
      # Keeps Environment properties out of the unauthenticated /actuator/info endpoint.
      enabled: false

# -- Logging -------------------------------------------------------------------
logging:
  level:
    root: INFO
    # App packages at the same level; dev profile raises this to DEBUG.
    com.pms: INFO
    # Silences Spring's PageImpl serialization-stability warning (tracked as backlog N-4) without hiding real errors.
    org.springframework.data.web.config: ERROR
