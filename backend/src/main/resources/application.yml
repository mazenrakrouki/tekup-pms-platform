spring:
  application:
    name: pms-backend

  # ── Base de données ────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pms_db}
    username: ${DB_USERNAME:pms_user}
    # Aucune valeur par défaut : un démarrage mal configuré doit échouer immédiatement
    # plutôt que de démarrer avec un mot de passe connu. Les profils dev/test/prod
    # fournissent chacun leur propre valeur.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  # ── JPA / Hibernate ───────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gère le schéma (ADR-019)
    show-sql: false
    open-in-view: false           # Évite les requêtes en dehors des transactions
    properties:
      hibernate:
        format_sql: false
        default_schema: public
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # ── Flyway (ADR-019) ──────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false
    # Désactivé en dev : la base locale a pu diverger au fil des itérations.
    # Le profil prod (conteneurs, volume vierge) réactive la validation — toute
    # dérive de checksum doit y échouer bruyamment.
    validate-on-migrate: false

  # ── Cache (contexte de sécurité — ADR-017) ────────────────────
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=5m

  # ── JSON ──────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # ── MVC ───────────────────────────────────────────────────────
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

# ── Serveur ───────────────────────────────────────────────────────
server:
  port: 8090
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ── Configuration PMS ─────────────────────────────────────────────
pms:
  jwt:
    # Aucune valeur par défaut : voir la remarque sur DB_PASSWORD ci-dessus.
    # La valeur est utilisée telle quelle (octets UTF-8 bruts) pour HMAC-SHA512 :
    # elle doit faire au moins 64 caractères. Ce n'est PAS du base64 décodé.
    secret: ${JWT_SECRET}
    access-token-expiration: 900        # 15 minutes (en secondes)
    refresh-token-expiration: 604800    # 7 jours (en secondes)
  security:
    bcrypt-strength: 12
    cookie-secure: ${COOKIE_SECURE:false}   # true derrière HTTPS uniquement
  cors:
    allowed-origins:
      - "http://localhost:4200"
      - "http://127.0.0.1:4200"

# ── API Documentation (springdoc) ────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    disable-swagger-default-url: true

# ── Actuator (sondes de conteneur — ADR-026) ─────────────────────
# Seuls health et info sont exposés. show-details: never garantit qu'un appel
# non authentifié ne divulgue aucun détail d'infrastructure (état de la base, disque…).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

# ── Logging ───────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.pms: INFO
    # Suppress PageImpl serialization stability warning (N-4: VIA_DTO changes JSON shape, deferred)
    org.springframework.data.web.config: ERROR
