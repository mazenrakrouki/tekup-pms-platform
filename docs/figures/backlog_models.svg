<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 812">
  <style>
    text { font-family: "Segoe UI","Helvetica Neue",Arial,sans-serif; fill:#16212B; }
    .h1   { font-weight:700; font-size:25px; }
    .colh { font-weight:700; font-size:20px; fill:#1F4E79; }
    .sub  { font-size:16px; fill:#5C6B7A; }
    .cls  { font-weight:700; font-size:17px; fill:#16212B; }
    .lab  { font-size:14px; fill:#41505F; }
    .card { fill:#FFFFFF; stroke:#33383D; stroke-width:1.6; }
    .panel{ fill:#FAFBFC; stroke:#D6DDE4; stroke-width:1.4; }
    .edge { fill:none; stroke:#33383D; stroke-width:1.8; }
    .chip { fill:#E8F0F7; stroke:#9FB6CB; stroke-width:1.2; }
    .chipg{ fill:#EDF6EF; stroke:#79B393; stroke-width:1.2; }
    .chipd{ fill:#F6E9E8; stroke:#D3A6A2; stroke-width:1.2; }
    .ok   { fill:#2E7D4F; font-size:16px; font-weight:700; }
    .bad  { fill:#B3413A; font-size:16px; font-weight:700; }
    .note { font-size:15px; fill:#41505F; }
    .sep  { stroke:#D6DDE4; stroke-width:1.4; }
    .box  { fill:none; stroke:#9FB6CB; stroke-width:1.5; stroke-dasharray:5 4; }
  </style>
  <defs>
    <marker id="fd" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="13" markerHeight="9" orient="auto">
      <path d="M0 5 L7 0 L14 5 L7 10 z" fill="#33383D"/>
    </marker>
  </defs>

  <text class="h1" x="600" y="44" text-anchor="middle">Where does a backlog item attach?</text>
  <line class="sep" x1="600" y1="72" x2="600" y2="770"/>

  <!-- ======================= LEFT: the usual chain ======================= -->
  <text class="colh" x="40" y="106">Model A — the usual chain</text>
  <text class="sub"  x="40" y="130">the sprint owns the item</text>

  <rect class="card" x="190" y="158" width="210" height="44" rx="4"/>
  <text class="cls" x="295" y="186" text-anchor="middle">Project</text>
  <path class="edge" d="M295 248 L295 206" marker-end="url(#fd)"/>
  <rect class="card" x="190" y="248" width="210" height="44" rx="4"/>
  <text class="cls" x="295" y="276" text-anchor="middle">Sprint</text>
  <path class="edge" d="M295 338 L295 296" marker-end="url(#fd)"/>
  <rect class="card" x="190" y="338" width="210" height="44" rx="4"/>
  <text class="cls" x="295" y="366" text-anchor="middle">BacklogItem</text>

  <text class="note" x="40" y="424">The item reaches the project only</text>
  <text class="note" x="40" y="446">through its sprint.</text>

  <!-- scenario -->
  <rect class="panel" x="40" y="474" width="510" height="266" rx="8"/>
  <text class="lab" x="64" y="504" font-weight="700">10 items written down, 3 put into Sprint 1</text>

  <rect class="box" x="64" y="524" width="234" height="86" rx="6"/>
  <text class="lab" x="76" y="546">Sprint 1</text>
  <rect class="chipg" x="76" y="558" width="62" height="34" rx="4"/>
  <rect class="chipg" x="146" y="558" width="62" height="34" rx="4"/>
  <rect class="chipg" x="216" y="558" width="62" height="34" rx="4"/>
  <text class="ok" x="181" y="632" text-anchor="middle">3 items: fine</text>

  <text class="lab" x="330" y="546">the other 7</text>
  <rect class="chipd" x="330" y="558" width="46" height="26" rx="4"/>
  <rect class="chipd" x="384" y="558" width="46" height="26" rx="4"/>
  <rect class="chipd" x="438" y="558" width="46" height="26" rx="4"/>
  <rect class="chipd" x="330" y="590" width="46" height="26" rx="4"/>
  <rect class="chipd" x="384" y="590" width="46" height="26" rx="4"/>
  <rect class="chipd" x="438" y="590" width="46" height="26" rx="4"/>
  <rect class="chipd" x="330" y="622" width="46" height="26" rx="4"/>

  <text class="bad" x="64" y="682">No sprint, so no project.</text>
  <text class="note" x="64" y="706">They belong to nothing and cannot be saved. The</text>
  <text class="note" x="64" y="726">product backlog screen cannot be built.</text>

  <!-- ========================= RIGHT: PMS ============================== -->
  <text class="colh" x="650" y="106">Model B — PMS</text>
  <text class="sub"  x="650" y="130">the project owns the backlog</text>

  <rect class="card" x="800" y="158" width="210" height="44" rx="4"/>
  <text class="cls" x="905" y="186" text-anchor="middle">Project</text>
  <path class="edge" d="M770 288 L862 206" marker-end="url(#fd)"/>
  <path class="edge" d="M1060 288 L950 206" marker-end="url(#fd)"/>
  <rect class="card" x="662" y="288" width="196" height="44" rx="4"/>
  <text class="cls" x="760" y="316" text-anchor="middle">Sprint</text>
  <rect class="card" x="962" y="288" width="196" height="44" rx="4"/>
  <text class="cls" x="1060" y="316" text-anchor="middle">BacklogItem</text>
  <path class="edge" d="M858 310 L962 310"/>
  <text class="lab" x="910" y="302" text-anchor="middle">commits</text>
  <text class="lab" x="872" y="334">0..1</text>
  <text class="lab" x="922" y="334">0..*</text>

  <text class="note" x="650" y="380">The project owns its sprints and its backlog.</text>
  <text class="note" x="650" y="402">A sprint only borrows items for its period, so an</text>
  <text class="note" x="650" y="424">item may have no sprint. That is the 0..1.</text>

  <!-- scenario -->
  <rect class="panel" x="650" y="474" width="510" height="266" rx="8"/>
  <text class="lab" x="674" y="504" font-weight="700">the same 10 items</text>

  <rect class="box" x="674" y="518" width="462" height="150" rx="6"/>
  <text class="lab" x="686" y="540">Project PMS</text>

  <rect class="box" x="686" y="552" width="234" height="86" rx="6"/>
  <text class="lab" x="698" y="574">Sprint 1</text>
  <rect class="chipg" x="698" y="586" width="62" height="34" rx="4"/>
  <rect class="chipg" x="768" y="586" width="62" height="34" rx="4"/>
  <rect class="chipg" x="838" y="586" width="62" height="34" rx="4"/>

  <text class="lab" x="944" y="574">product backlog</text>
  <rect class="chip" x="944" y="582" width="56" height="24" rx="4"/>
  <rect class="chip" x="1006" y="582" width="56" height="24" rx="4"/>
  <rect class="chip" x="1068" y="582" width="56" height="24" rx="4"/>
  <rect class="chip" x="944" y="610" width="56" height="24" rx="4"/>
  <rect class="chip" x="1006" y="610" width="56" height="24" rx="4"/>
  <rect class="chip" x="1068" y="610" width="56" height="24" rx="4"/>
  <rect class="chip" x="944" y="638" width="56" height="24" rx="4"/>

  <text class="ok" x="674" y="700">All 10 belong to the project.</text>
  <text class="note" x="674" y="724">3 are committed to Sprint 1. The other 7 are the product backlog.</text>

  <line class="sep" x1="40" y1="770" x2="1160" y2="770"/>
  <text class="note" x="600" y="796" text-anchor="middle">The whole difference is one question: may an item exist with no sprint? In PMS it may, and sprint_id is nullable for that reason.</text>
</svg>
