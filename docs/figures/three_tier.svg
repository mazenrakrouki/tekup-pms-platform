<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 45 1150 555">
  <style>
    text { font-family: "Segoe UI","Helvetica Neue",Arial,sans-serif; fill:#16212B; }
    .tier { font-weight:700; fill:#1F4E79; font-size:19px; }
    .tiny { fill:#8592A0; font-size:15px; }
    .n    { font-weight:700; fill:#1F4E79; font-size:21px; }
    .m    { fill:#5C6B7A; font-size:16px; }
    .chip { fill:#E8F0F7; stroke:#C3D4E4; stroke-width:1.3; }
    .band { fill:#F4F8FB; stroke:#AEBCC9; stroke-width:1.6; }
    .flow { fill:none; stroke:#1F4E79; stroke-width:2.6; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="#1F4E79"/>
    </marker>
  </defs>

  <!-- ============================ presentation ============================= -->
  <text class="tier" x="180" y="118" text-anchor="end">Presentation</text>
  <text class="tiny" x="180" y="140" text-anchor="end">tier</text>
  <rect class="band" x="200" y="70" width="700" height="110" rx="8"/>
  <rect x="226" y="94" width="150" height="62" rx="4" fill="#FFFFFF" stroke="#AEBCC9" stroke-width="1.4"/>
  <rect x="226" y="94" width="150" height="15" rx="4" fill="#DCE7F1"/>
  <rect x="226" y="104" width="150" height="5" fill="#DCE7F1"/>
  <circle cx="236" cy="101" r="2.6" fill="#8FA8BF"/>
  <circle cx="245" cy="101" r="2.6" fill="#8FA8BF"/>
  <circle cx="254" cy="101" r="2.6" fill="#8FA8BF"/>
  <rect x="236" y="120" width="60" height="6" rx="2" fill="#C3D4E4"/>
  <rect x="236" y="132" width="100" height="6" rx="2" fill="#DCE7F1"/>
  <rect x="236" y="144" width="80" height="6" rx="2" fill="#DCE7F1"/>
  <text class="n" x="404" y="122">Angular single-page application</text>
  <text class="m" x="404" y="148">renders the interface; holds no business rule</text>
  <text class="m" x="920" y="118">runs in the user&#8217;s</text>
  <text class="m" x="920" y="140">browser</text>

  <path class="flow" d="M550 180 V 222" marker-end="url(#a)"/>
  <text class="m" x="570" y="207">HTTPS &#183; REST / JSON</text>

  <!-- ============================ application ============================== -->
  <text class="tier" x="180" y="318" text-anchor="end">Application</text>
  <text class="tiny" x="180" y="340" text-anchor="end">tier</text>
  <rect class="band" x="200" y="230" width="700" height="190" rx="8"/>
  <text class="n" x="226" y="264">Spring Boot application</text>
  <text class="m" x="226" y="290">one deployable artefact, ten functional modules</text>
  <rect class="chip" x="226" y="306" width="122" height="34" rx="5"/>
  <text x="287" y="329" text-anchor="middle" style="font-size:16px; fill:#1F4E79;">auth</text>
  <rect class="chip" x="360" y="306" width="122" height="34" rx="5"/>
  <text x="421" y="329" text-anchor="middle" style="font-size:16px; fill:#1F4E79;">user</text>
  <rect class="chip" x="494" y="306" width="122" height="34" rx="5"/>
  <text x="555" y="329" text-anchor="middle" style="font-size:16px; fill:#1F4E79;">project</text>
  <rect class="chip" x="628" y="306" width="122" height="34" rx="5"/>
  <text x="689" y="329" text-anchor="middle" style="font-size:16px; fill:#1F4E79;">team</text>
  <rect class="chip" x="762" y="306" width="122" height="34" rx="5"/>
  <text x="823" y="329" text-anchor="middle" style="font-size:16px; fill:#1F4E79;">workload</text>
  <rect class="chip" x="226" y="350" width="122" height="34" rx="5"/>
  <text x="287" y="373" text-anchor="middle" style="font-size:16px; fill:#1F4E79;">agile</text>
  <rect class="chip" x="360" y="350" width="122" height="34" rx="5"/>
  <text x="421" y="373" text-anchor="middle" style="font-size:16px; fill:#1F4E79;">billing</text>
  <rect class="chip" x="494" y="350" width="122" height="34" rx="5"/>
  <text x="555" y="373" text-anchor="middle" style="font-size:16px; fill:#1F4E79;">mission</text>
  <rect class="chip" x="628" y="350" width="122" height="34" rx="5"/>
  <text x="689" y="373" text-anchor="middle" style="font-size:16px; fill:#1F4E79;">governance</text>
  <rect class="chip" x="762" y="350" width="122" height="34" rx="5"/>
  <text x="823" y="373" text-anchor="middle" style="font-size:16px; fill:#1F4E79;">kpi</text>

  <path d="M910 246 H 926 V 404 H 910" fill="none" stroke="#C4212A" stroke-width="1.8"/>
  <text x="938" y="300" style="font-size:16px; fill:#C4212A;">three tiers are not</text>
  <text x="938" y="322" style="font-size:16px; fill:#C4212A;">three services: this is</text>
  <text x="938" y="344" style="font-size:16px; fill:#C4212A;">one deployable artefact</text>

  <path class="flow" d="M550 420 V 462" marker-end="url(#a)"/>
  <text class="m" x="570" y="447">JDBC &#183; SQL</text>

  <!-- =============================== data ================================== -->
  <text class="tier" x="180" y="512" text-anchor="end">Data</text>
  <text class="tiny" x="180" y="534" text-anchor="end">tier</text>
  <rect class="band" x="200" y="470" width="700" height="110" rx="8"/>
  <ellipse cx="272" cy="502" rx="42" ry="13" fill="#FFFFFF" stroke="#AEBCC9" stroke-width="1.4"/>
  <path d="M230 502 V 546 A 42 13 0 0 0 314 546 V 502" fill="#FFFFFF" stroke="#AEBCC9" stroke-width="1.4"/>
  <path d="M230 520 A 42 13 0 0 0 314 520" fill="none" stroke="#DCE7F1" stroke-width="1.4"/>
  <text class="n" x="342" y="514">PostgreSQL</text>
  <text class="m" x="342" y="540">schema managed by versioned migrations</text>
  <text class="m" x="920" y="512">one instance, one</text>
  <text class="m" x="920" y="534">transactional boundary</text>
</svg>
